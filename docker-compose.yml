services:
  mongodb:
    image: mongo:6.0
    container_name: flash-ticket-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - flash-net

  redis:
    image: redis:7-alpine
    container_name: flash-ticket-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--notify-keyspace-events", "KEA"]
    volumes:
      - redis_data:/data
    networks:
      - flash-net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: flash-ticket-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/flash_tickets
      - REDIS_URL=redis://redis:6379
      - CLIENT_URL=http://localhost:3000
      - NODE_ENV=production
    depends_on:
      - mongodb
      - redis
    networks:
      - flash-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: flash-ticket-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - flash-net

volumes:
  mongo_data:
  redis_data:

networks:
  flash-net:
    driver: bridge
